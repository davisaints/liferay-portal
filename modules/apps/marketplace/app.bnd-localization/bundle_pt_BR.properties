liferay-releng-app-description=O Liferay Marketplace é parte integral da experiência da plataforma Liferay para todos os usuários. Assinantes Enterprise também têm acesso exclusivo aos Aplicativos de Assinatura Liferay através do Liferay Marketplace. Autentique-se com sua conta Liferay para navegar por centenas de aplicativos para ajudá-lo a construir sua solução técnica ou de negócio.