liferay-releng-app-description=O plugin Liferay para OAuth 2.0 implementa um protocolo de autorização padrão do setor. Ele permite que os usuários façam login no seu site compartilhando de forma segura credenciais específicas de outro site. O processo autoriza o acesso sem senha a recursos protegidos do usuário (como endereço de e-mail, foto do perfil ou outros dados da conta) e a outros recursos com permissões adequadas.