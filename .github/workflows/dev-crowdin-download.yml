jobs:
    crowdin:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v4
            -   env:
                    CROWDIN_PERSONAL_TOKEN_DEV: ${{ secrets.CROWDIN_PERSONAL_TOKEN_DEV }}
                    CROWDIN_PROJECT_ID_DEV: ${{ secrets.CROWDIN_PROJECT_ID_DEV }}
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                name: Synchronize with Crowdin
                uses: crowdin/github-action@v2
                with:
                    create_pull_request: true
                    download_translations: true
                    download_translations_args: >
                        --branch=master
                        --language=pt-BR
                        --preserve-hierarchy
                        --verbose
                    localization_branch_name: l10n_LPD-62788-dev
                    pull_request_base_branch_name: LPD-62788-dev
                    pull_request_body: LPD-62788-dev New Crowdin pull request with translations
                    pull_request_title: LPD-62788-dev Update Translations
                    upload_sources: false
                    upload_translations: false
name: DEV - Download Translations from Crowdin
on:
    push:
        branches:
            - master