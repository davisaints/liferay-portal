"files":
    [
        {
            escape_quotes: 0,
            escape_special_characters: 0,
            "languages_mapping":
                {
                    "locale":
                        {
                            "pt-BR" : "pt_BR",
                    },
                },
            skip_untranslated_strings: 0,
            source: "crowdin/Language.properties",
            translation: "crowdin/%file_name%_%locale%.%file_extension%",
        },
    ]
api_token_env: CROWDIN_PERSONAL_TOKEN_DEV
base_path: .
preserve_hierarchy: 1
project_id_env: CROWDIN_PROJECT_ID_DEV